version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edumanage-app:latest
    container_name: edumanage_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Mount the .env file so sensitive data is passed in securely
      - ./.env:/var/www/html/.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=student_app
      - DB_USERNAME=student_user
      - DB_PASSWORD=root
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    container_name: edumanage_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_app
      MYSQL_USER: student_user
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
